<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or Sign up — Cedar Creek Basecamp</title>
<link rel="icon" href="images/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-bg">

<div id="siteHeader"></div>

<div class="auth-wrap">
  <div class="auth-card" id="authCard">
    <div class="auth-top">
      <img src="images/logo.jpg" alt="">
      <h1>Welcome to the basecamp</h1>
      <p>Log in or create an account to plan your stay.</p>
    </div>

    <div id="authForms">
      <div class="auth-tabs">
        <button id="tabLogin" class="active" type="button">Log in</button>
        <button id="tabSignup" type="button">Sign up</button>
      </div>
      <div class="auth-body">
        <!-- LOG IN -->
        <form id="formLogin">
          <label for="liEmail">Email</label>
          <input id="liEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="liPass">Password</label>
          <input id="liPass" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button class="btn btn-primary" type="submit">Log in</button>
        </form>

        <!-- SIGN UP -->
        <form id="formSignup" hidden>
          <label for="suName">Name</label>
          <input id="suName" type="text" autocomplete="name" placeholder="Your name" required>
          <label for="suEmail">Email</label>
          <input id="suEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="suPass">Password</label>
          <input id="suPass" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>

        <p id="authMsg" class="auth-msg" hidden></p>

        <div class="auth-or"><span>or</span></div>
        <button type="button" id="googleBtn" class="google-btn">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-note">Demo sign-in: accounts (including Google) are saved on this device only. We can connect real, secure Google sign-in before launch.</p>
      </div>
    </div>

    <!-- shown once signed in -->
    <div class="auth-body signed-in" id="signedIn" hidden>
      <div class="team-avatar" style="margin:0 auto 14px;">✓</div>
      <div class="who"></div>
      <div class="email"></div>
      <a class="btn btn-primary" href="schedule.html" style="width:100%;justify-content:center;margin-bottom:10px;">📅 Plan your stay</a>
      <button class="btn btn-ghost" id="signOutBtn" type="button" style="width:100%;justify-content:center;">Log out</button>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/site.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
